#####################################################################
# 	Temperature Sensor Settings
#####################################################################
[heater_bed]
##  SSR Pin - HE1
##  Thermistor - TB
heater_pin: PF6
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PB0
max_power: 0.8
min_temp: 0
max_temp: 120

[temperature_sensor bed_pad]
sensor_type: Generic 3950
sensor_pin: PB1
#min_temp: -40
#max_temp: 100

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: -40
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: -40
max_temp: 110


[temperature_sensor Toolhead]
sensor_type: Generic 3950
sensor_pin: toolhead:PA0
pullup_resistor: 2200

[temperature_sensor Chamber_Bottom]
sensor_type: Generic 3950
sensor_pin: PC5

[temperature_sensor Chamber_Top]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA7

[temperature_sensor Chamber]
sensor_type: temperature_combined
sensor_list: temperature_sensor Chamber_Bottom, temperature_sensor Chamber_Top
#   Must be provided. List of sensors to combine to new "virtual"
#   sensor. Each entry should be the full name of a temperature-
#   reporting object as it appears in the config (e.g. 'extruder',
#   'heater_bed', or 'temperature_sensor <name>' for custom sensors).
#   E.g. 'temperature_sensor sensor1, temperature_sensor sensor2'
#   E.g. 'extruder, heater_bed'
#   E.g. 'temperature_sensor chamber, extruder, heater_bed'
combination_method: mean
#   Must be provided. Combination method used for the sensor.
#   Available options are 'max', 'min', 'mean'.
maximum_deviation: 10
#   Must be provided. Maximum permissible deviation between the sensors
#   to combine (e.g. 5 degrees). To disable it, use a large value (e.g. 999.9)
