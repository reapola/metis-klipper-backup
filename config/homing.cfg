#####################################################
#  Sensorless homing override — Voron 2.4 / 300
#  Sensorless on X & Y
#
#  All tunables live in [gcode_macro _HOMING_VARIABLES]
#  below — edit there, not inside the macros.
#####################################################

[gcode_macro _HOMING_VARIABLES]
description: Tunable values for the homing override
# --- Currents (A) ---
variable_home_current:        0.50   # SG-tuned current for X/Y homing
variable_print_current:       0.990   # Normal running current

# --- Move distances (mm) ---
variable_x_retract:           75      # Back X off from min after home
variable_y_retract:           75      # Back Y off from max after home
variable_y_scoot:             2      # Pre-X-home Y scoot (clears rear gantry)
variable_z_lift:              11      # Z lift when Z position is unknown
variable_z_floor:             30      # Min Z before X/Y home when Z is homed
variable_z_post_home_lift:    30      # Z height to leave at after Z home

# --- Speeds (mm/min) ---
variable_x_retract_speed:     7200
variable_y_retract_speed:     7200
variable_y_scoot_speed:       1200
variable_z_lift_speed:        1200
variable_bed_travel_speed:    12000
variable_z_post_home_speed:   1200

# --- StallGuard settle delays (ms) ---
variable_sg_settle_pre:       2000    # After X-home move-away, before current restore
variable_sg_settle_post:      1000    # After current restore

# --- Bed centre for Z home (mm) ---
variable_bed_center_x:        150
variable_bed_center_y:        150
gcode:
    # Variable holder only — never invoked

[gcode_macro _HOME_X]
gcode:
    {% set v = printer["gcode_macro _HOMING_VARIABLES"] %}
    # CoreXY: both motors carry load during any X move, so drop both currents
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={v.home_current} HOLDCURRENT={v.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={v.home_current} HOLDCURRENT={v.home_current}
    G28 X
    G91
    M400
    G1 X-{v.x_retract} F{v.x_retract_speed}
    G90
    # Wait for SG registers to clear, then restore print currents
    M400
    G4 P{v.sg_settle_pre}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={v.print_current} HOLDCURRENT={v.print_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={v.print_current} HOLDCURRENT={v.print_current}
    M400
    G4 P{v.sg_settle_post}

[gcode_macro _HOME_Y]
gcode:
    {% set v = printer["gcode_macro _HOMING_VARIABLES"] %}
    # CoreXY: both motors carry load during any X move, so drop both currents
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={v.home_current} HOLDCURRENT={v.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={v.home_current} HOLDCURRENT={v.home_current}
    G28 Y
    G91
    M400
    G1 Y-{v.y_retract} F{v.y_retract_speed}
    G90
    # Wait for SG registers to clear, then restore print currents
    M400
    G4 P{v.sg_settle_pre}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={v.print_current} HOLDCURRENT={v.print_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={v.print_current} HOLDCURRENT={v.print_current}
    M400
    G4 P{v.sg_settle_post}

[homing_override]
set_position_z: 0
axes: z
gcode:
   G90
   G1 Z5 F600
   G28 Z METHOD=CONTACT CALIBRATE=1



#####################################################################
# 	Z Homing, QGL and Bed Mesh Settings
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_B039CAA54E5737374D202020FF0A092A-if00  
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 22 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 1

accel_axes_map: -x, -y, z
home_xy_position: 150, 150
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never
contact_max_hotend_temperature: 300
lift_speed: 50
z_settling_time: 200


[quad_gantry_level]
##  Gantry Corners for 300mm Build
##  Uncomment for 300mm build

gantry_corners:
   -60,-10
   360,370

##  Probe points
points:
   30,10
   30,230
   270,230
   270,10
   
speed: 300
horizontal_move_z: 5
retries: 8
retry_tolerance: 0.0075
max_adjust: 10


[bed_mesh]
speed: 300
zero_reference_position: 150, 150
horizontal_move_z: 2
mesh_min: 60,60
mesh_max: 260,260
probe_count: 29,29
algorithm: bicubic
split_delta_z: 0.0125
move_check_distance: 3
fade_start: 0.5
fade_end: 10
mesh_pps: 0, 0
adaptive_margin: 10